site_name: Peclet
site_description: GPU-accelerated & parallel simulation of transport phenomena (CFD, DEM, Voronoi)
repo_url: https://github.com/computational-chemical-engineering/peclet
repo_name: peclet
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

# Reuse the in-repo design docs as the single source of truth (also rendered on GitHub).
# The API references live on each submodule's own Doxygen Pages site (external links); the worked
# examples are the sibling peclet-examples Quarto site. Keep version numbers OUT of the pages
# listed here — the PyPI badge on the home page and the CHANGELOG carry the current version.
nav:
  - Home: index.md
  - Examples gallery: https://computational-chemical-engineering.github.io/peclet-examples/
  - Install & run: DEPLOYMENT.md
  - Containers (HPC): containers.md
  - HPC sites:
      - Snellius: SNELLIUS.md
      - LUMI (untested): LUMI.md
  - Python API:
      - Overview: python/index.md
      - peclet.flow: python/flow.md
      - peclet.dem: python/dem.md
      - peclet.voro: python/voro.md
      - peclet.pnm: python/pnm.md
      - peclet.coupling: python/coupling.md
      - peclet.core: python/core.md
      - peclet.amr: python/amr.md
      - peclet.morton: python/morton.md
  - Design:
      - Architecture: ARCHITECTURE.md
      - Conventions: CONVENTIONS.md
      - Naming canon: NAMING.md
      - Interfaces: INTERFACES.md
      - Style: STYLE.md
      - Portability: PORTABILITY.md
      - Roadmap: ROADMAP.md
      - Quality plan (1.0.0): QUALITY_PLAN.md
      - Decomposition and multigrid: DECOMPOSITION_AND_MULTIGRID.md
      - Scaling issues: SCALING_ISSUES.md
      - Physical units (phases 3-4 open): PHYSICAL_UNITS_PLAN.md
  - Releasing:
      - Release workflow: RELEASE.md
      - Release preparation (current): RELEASE_PREP.md
  - Studies:
      - Staggered vs collocated (flow): studies/staggered_vs_colocated.md
      - Covolume vs collocated on a Voronoi mesh (voro): studies/voro_covolume_vs_collocated.md
      - Voronoi update throughput (voro): studies/voro_update_throughput.md
  - C++ API (Doxygen):
      - peclet-core: https://computational-chemical-engineering.github.io/peclet-core/
      - peclet-amr: https://computational-chemical-engineering.github.io/peclet-amr/
      - peclet-morton: https://computational-chemical-engineering.github.io/peclet-morton/
      - peclet-flow: https://computational-chemical-engineering.github.io/peclet-flow/
      - peclet-pnm: https://computational-chemical-engineering.github.io/peclet-pnm/
      - peclet-dem: https://computational-chemical-engineering.github.io/peclet-dem/
      - peclet-voro: https://computational-chemical-engineering.github.io/peclet-voro/
  - Archive (historical design notes):
      - About the archive: archive/README.md
      - AMR octree (design & status): archive/AMR.md
      - AMR geometry setup requirements: archive/AMR_GEOMETRY_SETUP_REQUIREMENTS.md
      - Analytic SDF geometry: archive/ANALYTIC_SDF_GEOMETRY.md
      - Communication scaling: archive/COMMUNICATION_SCALING.md
      - Defect correction (plan): archive/DEFECT_CORRECTION_PLAN.md
      - Defect correction (session prompt): archive/DEFECT_CORRECTION_PROMPT.md
      - Device residency: archive/DEVICE_RESIDENCY_PLAN.md
      - Multigrid telescoping: archive/MG_TELESCOPING_PLAN.md
      - Multiphysics framework: archive/MULTIPHYSICS_PLAN.md
      - VoF plan: archive/VOF_PLAN.md
      - VoF handoff note: archive/VOF_NEXT_SESSION.md
      - Voronoi methods plan: archive/VORONOI_METHODS_PLAN.md
      - peclet-cuda wheel prototype: archive/peclet_cuda_wheel_prototype.md
  - Privacy: privacy.md

