# The `peclet` metapackage — `pip install peclet` pulls the self-contained CPU (OpenMP) build of the
# suite: the Morton index, the Eulerian NS solver, the DEM packer, and the Voronoi engine. It ships NO
# code of its own (so `peclet` stays an implicit PEP-420 namespace owned by the member packages) — it is
# purely a convenience dependency set.
#
#   pip install peclet          # CPU family: peclet-morton + peclet-flow + peclet-pnm + peclet-dem + peclet-voro
#   pip install peclet[mpi]     # + peclet-core (MPI particle halo / AMR — builds from sdist, needs MPI)
#   pip install peclet-cu13     # single-GPU CUDA family (packaging/pyproject-cu13.toml): peclet-morton + the
#                               # peclet-{flow,pnm,dem,voro}-cu13 wheels (libcudart from nvidia-cuda-runtime);
#                               # MUTUALLY EXCLUSIVE with `peclet` (same `peclet.*` imports) — one venv each.
#
# AMD/HIP and multi-rank MPI are NOT pip-installable as portable wheels (arch x ROCm x MPI-ABI): build the
# member packages from source against a Kokkos prefix, or use the containers. See docs/DEPLOYMENT.md.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peclet"
version = "1.1.0"
description = "GPU-accelerated & parallel simulation of transport phenomena (CFD, DEM, Voronoi) — CPU family metapackage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "E.A.J.F. Peters", email = "e.a.j.f.peters@tue.nl" }]
# The wheels are manylinux x86-64 and there is no Windows or macOS build (suite docs/DEPLOYMENT.md,
# "Operating system"); say so on the PyPI page, where a reader looks before pip tells them.
keywords = ["computational fluid dynamics", "CFD", "discrete element method", "DEM", "immersed boundary", "porous media", "multiphase flow", "GPU", "MPI", "HPC", "Kokkos", "transport phenomena"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "peclet-morton==1.0.1",
  "peclet-flow==1.1.0",
  "peclet-pnm==1.0.2",
  "peclet-dem==1.0.2",
  "peclet-voro==1.0.2",
]

[project.optional-dependencies]
# peclet-core is sdist-only (MPI particle halo + Kokkos AMR): installing it builds from source and needs
# an MPI toolchain (+ optional Kokkos prefix for the AMR module).
mpi = ["peclet-core==1.0.2"]
# peclet-amr (block-octree AMR + its solver, under development) is sdist-only too: needs MPI, a Kokkos
# backend and peclet-morton; pinned to the family version at tag time like every member.
amr = ["peclet-amr==0.1.1"]
# peclet-coupling is the unresolved point-particle CFD-DEM coupling of peclet.flow + peclet.dem
# (sdist-only: builds its Kokkos kernels from source against a bootstrapped prefix).
cfd-dem = ["peclet-coupling==1.0.1"]

[project.urls]
Homepage = "https://github.com/computational-chemical-engineering/peclet"
Documentation = "https://computational-chemical-engineering.github.io/peclet/"
"Examples gallery" = "https://computational-chemical-engineering.github.io/peclet-examples/"
Issues = "https://github.com/computational-chemical-engineering/peclet/issues"
Changelog = "https://github.com/computational-chemical-engineering/peclet/blob/main/CHANGELOG.md"

# No Python package is built — this metapackage is dependencies only. Point hatchling at an empty target
# so it produces a valid (code-free) wheel/sdist.

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "LICENSE"]
