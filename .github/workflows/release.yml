name: Release

# Publish the `peclet` metapackage (a code-free, dependencies-only convenience package) AND its
# single-GPU CUDA twin `peclet-cu13` (packaging/pyproject-cu13.toml, pinning the *-cu13 members) to PyPI on
# a version tag, via Trusted Publishing (OIDC) — register the publisher for BOTH project names. The
# member packages (peclet-morton/flow/pnm/dem/voro/core, and the flow/pnm/dem/voro -cu13 variants) are
# released from their own submodule repos' release workflows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # BEFORE anything is built. A PyPI description is baked into the upload and cannot be edited
  # afterwards, so a stale README noticed after publishing costs an entire extra release to fix
  # (peclet 1.1.1 was exactly that, and 1.2.0 shipped three pages describing the layout it replaced).
  # This is the last moment the mistake is still cheap.
  landing-pages:
    name: landing pages are not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive     # the check reads each member's README
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # ONLY the pages this upload creates. A member's PyPI description is created by that
      # member's own release, and CI sees submodules at the umbrella's recorded POINTERS, which
      # legitimately lag a member's main whenever that member is deliberately not re-released —
      # so gating the metapackage on dem's README blocks a refresh for a page it does not publish.
      # (That is not hypothetical: it blocked 1.2.1 on its first attempt.) Members should add this
      # same job to their own release.yml with their own --dists.
      - run: python tools/release/check_landing_pages.py --dists peclet,peclet-cu13

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build          # pure-python sdist + wheel (hatchling)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  # peclet-cu13: the same code-free metapackage built from packaging/pyproject-cu13.toml (copied over
  # pyproject.toml), depending on the CUDA-13 member wheels instead of the CPU ones.
  build-cu13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: cp packaging/pyproject-cu13.toml pyproject.toml   # -> peclet-cu13 (+ *-cu13 member pins)
      - run: python -m build          # pure-python sdist + wheel (hatchling)
      - uses: actions/upload-artifact@v7
        with:
          name: dist-cu13
          path: dist/*

  publish:
    needs: [landing-pages, build, build-cu13]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist              # both artifacts (dist + dist-cu13) merged into one upload
          merge-multiple: true
      # Uploads both peclet and peclet-cu13; PyPI routes each file by its metadata name. Both projects must
      # have this workflow registered as a trusted publisher.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # completing a partial upload (e.g. adding peclet-cu13 after peclet) must
                                # not fail on the already-published files

  # A release is not done until the front door opens: execute the quick start (README.md,
  # docs/index.md, the Colab notebook) against the wheels this tag just published. 1.0.0 shipped a
  # landing page that raised TypeError on its first solver call, and nothing in CI looked.
  quickstart:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/quickstart.yml
    with:
      version: ${{ github.ref_name }}      # e.g. v1.0.0; the leading v is stripped there
