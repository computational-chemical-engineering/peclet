name: Wheel probe

# THROWAWAY. Does the peclet CPU family build outside Linux x86-64?
#
# 1.0.0 ships manylinux_2_28 x86-64 only, because that is the only runner the release workflows have
# ever used — never because anyone tried the others and found they failed. A Windows user's
# `pip install peclet` therefore falls back to the sdists and dies in CMake (RELEASE_PREP section
# 11.1). Before committing to a release matrix, find out what actually breaks: cibuildwheel for ONE
# interpreter (cp312) per package per runner, `fail-fast: false`, so every cell answers for itself.
#
# ROUND 1 (run 34769049419) already answered the first question, and the answer was narrow: nothing
# in peclet's own C++ failed anywhere. Kokkos 5.1.1 configured with MSVC 19.51 (/std:c++20) and with
# AppleClang 21 (-std=gnu++20); aarch64 Linux built and tested a whole Kokkos package (pnm) clean.
# Only OpenMP failed, twice, for two different reasons:
#   Windows  "Could NOT find OpenMP_CXX: Found unsuitable version 2.0, required at least 3.0"
#            -- MSVC's default /openmp IS OpenMP 2.0; the LLVM runtime (/openmp:llvm) is 3.1+,
#            reached through CMake's documented OpenMP_RUNTIME_MSVC=llvm.
#   macOS    "Could NOT find OpenMP_CXX (missing: OpenMP_CXX_FLAGS OpenMP_CXX_LIB_NAMES)"
#            -- AppleClang ships none at all. Homebrew's libomp turned out to be a dead end: it now
#            publishes only a tahoe bottle, which forces a macOS 26 wheel floor. Both platforms take
#            the Serial host backend instead, chosen automatically in cmake/PecletDeps.cmake.
# Plus two artefacts of the probe itself, fixed below: flow/pnm/dem/voro do not skip `*-win32`, so
# the Windows cell died on 32-bit and never reached win_amd64; and morton's test command resolves
# {project}, which is the umbrella here rather than the package.
#
# The guard no longer needs bypassing: Windows and macOS became SUPPORTED platforms once this probe
# showed they build, and the backend is now chosen by the build itself, so this workflow runs exactly
# what the release workflows run.
#
# `kokkos_args` reaches the VENDORED Kokkos configure, which is a nested CMake run that inherits
# nothing from this one (PECLET_VENDOR_KOKKOS_ARGS). Two values matter:
#   -DOpenMP_RUNTIME_MSVC=llvm     ask MSVC for the OpenMP 3.1+ runtime
#   -DKokkos_ENABLE_OPENMP=OFF     give up on OpenMP; build a Serial wheel instead

on:
  workflow_dispatch:
    inputs:
      kokkos_args:
        description: 'extra -D flags for the vendored Kokkos configure (PECLET_VENDOR_KOKKOS_ARGS)'
        type: string
        default: ''
      os_list:
        description: 'JSON array of runners to use'
        type: string
        default: '["windows-latest", "macos-latest", "ubuntu-24.04-arm"]'
      pkg_list:
        description: 'JSON array of packages to build'
        type: string
        default: '["morton", "flow", "pnm", "voro", "dem"]'
      cibw_build:
        description: 'CIBW_BUILD selector (which interpreters)'
        type: string
        default: 'cp312-*'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.pkg }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os_list) }}
        pkg: ${{ fromJSON(inputs.pkg_list) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true          # the packages are submodules; each is its own repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Everything cibuildwheel needs, assembled in one place: CIBW_ENVIRONMENT *replaces*
      # [tool.cibuildwheel.environment] rather than merging into it, and the _MACOS variant would
      # replace this in turn, so composing it here beats fighting the precedence.
      - name: Environment for this package
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.pkg }}" = "morton" ]; then
            echo 'CIBW_ENVIRONMENT=CMAKE_ARGS="-DMORTON_ENABLE_BMI2=OFF -DMORTON_ENABLE_RUNTIME_DISPATCH=ON"' >> "$GITHUB_ENV"
            echo 'CIBW_TEST_COMMAND=python -m pytest {package}/bindings/python/tests -q' >> "$GITHUB_ENV"
          else
            KK="${{ inputs.kokkos_args }}"
            echo "CIBW_ENVIRONMENT=PECLET_VENDOR_DEPS=ON PECLET_VENDOR_KOKKOS_ARGS=\"$KK\"" >> "$GITHUB_ENV"
          fi

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ matrix.pkg }}
        env:
          CIBW_BUILD: ${{ inputs.cibw_build }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_SKIP: "*-win32 *_i686 *-musllinux* pp*"

      # Does the backend this wheel carries actually go faster with more threads? The quick start
      # from README.md, on the wheel just built, at 1 / 2 / all threads. A Serial wheel will report
      # the same time three times, which is the point of asking.
      - name: Time the quick start on the wheel just built
        if: matrix.pkg == 'flow'
        shell: bash
        run: |
          set -eu
          python -m pip install --quiet numpy wheelhouse/*.whl
          cat > qs.py <<'PY'
          import os, sys, time
          import numpy as np
          import peclet.flow as flow
          L, R, rho, mu, F, N = 1.0, 0.2, 1.0, 0.1, 1.0, 32
          s = flow.Solver((N, N, N), extent=(L, L, L))
          x, y, z = s.cell_centers()
          X, Y, Z = np.meshgrid(x, y, z, indexing="ij")
          sdf = np.sqrt((X - L/2)**2 + (Y - L/2)**2 + (Z - L/2)**2) - R
          s.set_rho(rho); s.set_mu(mu); s.set_dt(1e3)
          s.set_body_force((F, 0.0, 0.0))
          s.set_solid(sdf, cutcell_pressure=True)
          t0, u = time.perf_counter(), []
          for it in range(200):
              s.step(); u.append(s.get_u().mean())
              if it >= 3 and abs(u[-1] - u[-4]) < 1e-3 * abs(u[-1]):
                  break
          dt = time.perf_counter() - t0
          k = mu * s.get_u().mean() / F
          print(f"RESULT {flow.execution_space:8s} threads={os.environ.get('KOKKOS_NUM_THREADS','all'):3s} "
                f"cpus={os.cpu_count()} steps={it+1} {dt:6.2f}s k={k:.4e}")
          PY
          for n in 1 2 ""; do
            if [ -n "$n" ]; then export KOKKOS_NUM_THREADS="$n"; else unset KOKKOS_NUM_THREADS; fi
            python qs.py
          done

      - name: What came out
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.pkg }} · ${{ matrix.os }}"
            if ls wheelhouse/*.whl >/dev/null 2>&1; then
              for w in wheelhouse/*.whl; do echo "- BUILT \`$(basename "$w")\`"; done
            else
              echo "- no wheel"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.pkg }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: ignore
