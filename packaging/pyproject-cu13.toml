# The `peclet-cu13` metapackage — the single-GPU CUDA twin of `peclet`. `pip install peclet-cu13` pulls
# the CUDA-13 builds of the compute members (`peclet-flow-cu13`, `peclet-pnm-cu13`, `peclet-dem-cu13`,
# `peclet-voro-cu13`; Kokkos-CUDA static inside each module, libcudart from the `nvidia-cuda-runtime`
# dependency wheel, only the NVIDIA driver host-provided) plus the pure-CPU `peclet-morton`. It ships NO
# code of its own (the `peclet` PEP-420 namespace is owned by the member packages) — purely a convenience
# dependency set, exactly like ../pyproject.toml.
#
#   pip install peclet-cu13          # CUDA family: peclet-morton + peclet-{flow,pnm,dem,voro}-cu13
#   pip install peclet-cu13[mpi]     # + peclet-core (MPI particle halo / AMR — builds from sdist, needs MPI)
#
# `peclet-cu13` and `peclet` are MUTUALLY EXCLUSIVE in one environment (both install the same
# `peclet.<member>` imports; the CuPy `cupy` vs `cupy-cuda12x` model) — use one venv per backend.
# AMD/HIP and multi-GPU MPI stay source/container builds (docs/DEPLOYMENT.md).
#
# The umbrella release workflow's build-cu13 job copies this over pyproject.toml; keep the `==` pins in
# lockstep with ../pyproject.toml (tools/release/check_release_state.sh compares them).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peclet-cu13"
version = "1.2.1"
description = "GPU-accelerated & parallel simulation of transport phenomena (CFD, DEM, Voronoi) — single-GPU CUDA family metapackage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "E.A.J.F. Peters", email = "e.a.j.f.peters@tue.nl" }]
# The wheels are manylinux x86-64 and there is no Windows or macOS build (suite docs/DEPLOYMENT.md,
# "Operating system"); say so on the PyPI page, where a reader looks before pip tells them.
keywords = ["computational fluid dynamics", "CFD", "discrete element method", "DEM", "immersed boundary", "porous media", "multiphase flow", "GPU", "MPI", "HPC", "Kokkos", "transport phenomena"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
  "peclet-morton==1.0.1",
  # peclet-geom: host-only SDF scene authoring, wheels, numpy-only. In the BASE install (not an
  # extra) because it is what peclet.dem's scene_particle.build() and eleven gallery pages need,
  # and it was unobtainable behind [mpi] while it shared a distribution with the halo bindings —
  # suite/docs/CORE_BOUNDARY.md. Same wheel for the CUDA family: there is nothing device-side in it.
  "peclet-geom==1.0.0",
  "peclet-flow-cu13==1.1.0",
  "peclet-pnm-cu13==1.0.2",
  "peclet-dem-cu13==1.0.2",
  "peclet-voro-cu13==1.0.2",
]

[project.optional-dependencies]
# The MPI particle halo (peclet-halo) is sdist-only: installing it builds from source and needs an MPI
# toolchain. It is reached through the peclet-core compatibility shell, which (since 1.1.0) pulls
# peclet-halo and peclet-geom, so `peclet[mpi]` still provides `peclet.core.mpi` as well as the
# canonical `peclet.halo`. At 2.0.0 this becomes peclet-halo directly and the shell is gone
# (CORE_BOUNDARY.md §3).
mpi = ["peclet-core==1.2.0"]
amr = ["peclet-amr==0.1.1"]
# peclet-coupling is the unresolved point-particle CFD-DEM coupling of peclet.flow + peclet.dem
# (sdist-only: builds its Kokkos kernels from source against a bootstrapped prefix).
cfd-dem = ["peclet-coupling==1.0.1"]

[project.urls]
Homepage = "https://github.com/computational-chemical-engineering/peclet"
Documentation = "https://computational-chemical-engineering.github.io/peclet/"
"Examples gallery" = "https://computational-chemical-engineering.github.io/peclet-examples/"

# No Python package is built — this metapackage is dependencies only. Point hatchling at an empty target
# so it produces a valid (code-free) wheel/sdist.
Issues = "https://github.com/computational-chemical-engineering/peclet/issues"
Changelog = "https://github.com/computational-chemical-engineering/peclet/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "LICENSE"]
